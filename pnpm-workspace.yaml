packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (native builds / engines).
allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - lucide-react@1.54.0
  - vite@8.3.4

# Security floors for indirect packages (audit 11/18). Prisma CLI tooling ones (mysql2,
# deepmerge-ts, fast-uri) are not used at run time but are pinned too.
overrides:
  body-parser@>=2.0.0 <2.4.0: '>=2.4.0'
  qs@>=6.7.0 <6.16.1: '>=6.16.1'
  uuid@<11.1.1: '>=11.1.1'
  ip-address@<10.7.4: '>=10.7.4'
  fast-uri@>=3.0.0 <3.1.9: '>=3.1.9'
  mysql2@<3.23.1: '>=3.23.1'
  deepmerge-ts@<8.0.0: '>=8.0.0'
