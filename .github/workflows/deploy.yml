# Replace .github/workflows/deploy.yml in someshvarivraj/telesales-dx.
# Deploy staging on a push/merge to main, AFTER verification in this workflow.
# Existing separate CI workflow may continue running; this job independently gates deploy.
name: Deploy to company EC2 (staging)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: telesales-dx-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_APP_REPOSITORY: telesales-dx-staging-app
  ECR_TOOLS_REPOSITORY: telesales-dx-staging-tools
  DEPLOY_DOCUMENT: telesales-dx-staging-deploy
  VITE_BASE_PATH: /telesales-dx-staging/
  IMAGE_TAG: ${{ github.sha }}-r${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: verify
    # Keep this false until the host dispatcher and restricted IAM trust are accepted.
    if: ${{ vars.DEPLOYMENT_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish app
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: |
            VITE_BASE_PATH=${{ env.VITE_BASE_PATH }}
          push: true
          provenance: false
          # The host accepts only images labelled with the exact commit and this repository
          # (staging_release_images.py: OCI revision/source labels, linux/amd64).
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_APP_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=telesales-dx
          cache-to: type=gha,scope=telesales-dx,mode=max
      - name: Build and publish tools
        id: tools
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          build-args: |
            VITE_BASE_PATH=${{ env.VITE_BASE_PATH }}
          push: true
          provenance: false
          # The host accepts only images labelled with the exact commit and this repository
          # (staging_release_images.py: OCI revision/source labels, linux/amd64).
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_TOOLS_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=telesales-dx
      - name: Deploy digest-pinned images through restricted SSM document
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          TOOLS_DIGEST: ${{ steps.tools.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${INSTANCE_ID:?DEPLOY_INSTANCE_ID must be set}"
          [[ "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TOOLS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DEPLOY_DOCUMENT" \
            --parameters "AppDigest=$APP_DIGEST,ToolsDigest=$TOOLS_DIGEST,ReleaseSha=$RELEASE_SHA" \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          STATUS=Pending
          for i in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "Deployment status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
          done
          if [[ "$STATUS" != Success ]]; then
            # Show the host's own message so the reason is visible here.
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query '{output: StandardOutputContent, errors: StandardErrorContent}' --output json || true
            echo "SSM release did not succeed ($STATUS). Existing release should remain protected by the host dispatcher."
            exit 1
          fi
      - name: Check public staging frontend (not protected health API)
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dx.morabu.com/telesales-dx-staging/'
          for i in $(seq 1 18); do
            CODE=$(curl --silent --show-error --location --max-time 10 \
              --output /dev/null --write-out '%{http_code}' "$URL" || true)
            echo "Frontend HTTP $CODE"
            if [[ "$CODE" == 200 ]]; then exit 0; fi
            sleep 10
          done
          echo 'Staging frontend did not return HTTP 200'
          exit 1
