    <title>メンテナンス中 | Telesales DX</title>
    <style>
      /* Sakura edition (request 11/12): the app's light grid in pink, with petals falling. */
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #fdf7f9;
        background-image:
          radial-gradient(
            ellipse at 50% 40%,
            rgba(255, 255, 255, 0.95),
            rgba(253, 247, 249, 0) 60%
          ),
          linear-gradient(rgba(190, 24, 93, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(190, 24, 93, 0.07) 1px, transparent 1px);
        background-size:
          100% 100%,
          32px 32px,
          32px 32px;
        color: #2b1d24;
        font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif;
      }
      #petals {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #bot {
        position: fixed;
        top: 0;
        left: 0;
        will-change: transform;
        transition: filter 0.25s;
      }
      #bot img {
        display: block;
        width: 100%;
        height: 100%;
      }
      #note {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        pointer-events: none;
        /* Stays readable while MoraBot passes behind it. */
        text-shadow:
          0 0 6px #fdf7f9,
          0 0 12px #fdf7f9;
      }
      h1 {
        margin: 0;
        font-size: clamp(20px, 3.4vw, 32px);
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #2b1d24;
      }
      h1::after {
        content: '';
        display: block;
        width: 56px;
        height: 3px;
        margin: 12px auto 0;
        background: #db2777;
      }
      p {
        margin: 10px 0 0;
        max-width: 34em;
        font-size: 14px;
        line-height: 1.7;
        color: #6b5560;
      }
      #until {
        font-size: 16px;
        font-weight: 700;
        color: #be185d;
      }
      #hits {
        position: fixed;
        right: 16px;
        bottom: 12px;
        font-size: 12px;
        color: #9d7d8a;
      }
      #cheer {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        font-weight: 700;
        color: #be185d;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .spark {
        position: fixed;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        pointer-events: none;
      }

      /**
 * One step of MoraBot bouncing around the screen, used by the app's overlay and, copied in by
 * scripts/build-outage-page.mjs, by outage.html. Plain JavaScript for that reason.
 * Returns 'corner', 'wall' or null.
 */
function stepBounce(s, dt, maxX, maxY, speed) {
  s.x += s.vx * dt;
  s.y += s.vy * dt;
  // Only a wall it is moving towards counts: bouncing off must not count as hitting it again.
  var hitX = (s.vx > 0 && s.x >= maxX) || (s.vx < 0 && s.x <= 0);
  var hitY = (s.vy > 0 && s.y >= maxY) || (s.vy < 0 && s.y <= 0);
  // Reaching one wall just short of the other counts as the corner.
  var near = Math.abs(s.vx * dt) + Math.abs(s.vy * dt) + 6;
  var nearX = s.vx > 0 ? maxX - s.x < near : s.x < near;
  var nearY = s.vy > 0 ? maxY - s.y < near : s.y < near;
  if (hitX && !hitY && nearY) hitY = true;
  if (hitY && !hitX && nearX) hitX = true;
  if (hitX) {
    s.x = s.vx > 0 ? maxX : 0;
    s.vx = -s.vx;
  }
  if (hitY) {
    s.y = s.vy > 0 ? maxY : 0;
    s.vy = -s.vy;
  }
  // The screen got smaller, or it started outside: back inside without counting a hit.
  s.x = Math.max(0, Math.min(maxX, s.x));
  s.y = Math.max(0, Math.min(maxY, s.y));
  if (!hitX && !hitY) return null;
  s.walls += 1;
  if (hitX && hitY) {
    // A new angle: straight back would only reach the opposite corner, again and again.
    var angle = (Math.PI / 180) * (25 + Math.random() * 40);
    s.vx = (s.vx > 0 ? 1 : -1) * speed * Math.cos(angle);
    s.vy = (s.vy > 0 ? 1 : -1) * speed * Math.sin(angle);
    return 'corner';
  }
  // Every few walls it heads straight for the corner it is moving towards.
  if (s.walls % 4 === 0) {
    var dx = (s.vx > 0 ? maxX : 0) - s.x;
    var dy = (s.vy > 0 ? maxY : 0) - s.y;
    var distance = Math.hypot(dx, dy);
    if (distance >= 80 && Math.abs(dx) >= 40 && Math.abs(dy) >= 40) {
      s.vx = (speed * dx) / distance;
      s.vy = (speed * dy) / distance;
    }
  }
  return 'wall';
}

              { gradientColorStart: 'rgba(212, 152, 163)', gradientColorEnd: 'rgba(242, 185, 196)', gradientColorDegree: 120 },
            ],
          });
        }

        var w, h, maxX, maxY;
        function measure() {
          w = Math.max(110, Math.min(190, window.innerWidth * 0.17));
          h = w * (560 / 466);
          maxX = Math.max(0, window.innerWidth - w);
          maxY = Math.max(0, window.innerHeight - h);
          bot.style.width = w + 'px';
          bot.style.height = h + 'px';
        }
        measure();
        window.addEventListener('resize', measure);

        var angle = Math.PI / 4 + (Math.random() * Math.PI) / 8;
        var state = {
          x: maxX * Math.random(),
          y: maxY * Math.random(),
          vx: SPEED * Math.cos(angle),
          vy: SPEED * Math.sin(angle),
          walls: 0,
        };
        var poseAt = 0;
        var colorAt = 0;
        var corners = 0;
        var cheerTimer = 0;

        function paint() {
          pose.src = POSES[poseAt];
          bot.style.filter = 'drop-shadow(0 0 16px ' + COLORS[colorAt] + ')';
        }
        function nextLook() {
          poseAt = (poseAt + 1) % POSES.length;
          colorAt = (colorAt + 1) % COLORS.length;
          paint();
        }
        paint();

        function burst(cx, cy, color) {
          for (var i = 0; i < 18; i++) {
            (function () {
              var dot = document.createElement('div');
              dot.className = 'spark';
              dot.style.left = cx + 'px';
              dot.style.top = cy + 'px';
              dot.style.background = color;
              document.body.appendChild(dot);
              var turn = Math.random() * Math.PI * 2;
              var far = 60 + Math.random() * 140;
              dot.animate(
                [
                  { transform: 'translate(0, 0)', opacity: 1 },
                  {
                    transform:
                      'translate(' + Math.cos(turn) * far + 'px,' + Math.sin(turn) * far + 'px)',
                    opacity: 0,
                  },
                ],
                { duration: 700, easing: 'ease-out' },
              ).onfinish = function () {
                dot.remove();
              };
            })();
          }
        }

        function hitCorner() {
          corners += 1;
          pose.src = HAPPY;
          bot.style.filter = 'drop-shadow(0 0 28px #f472b6)';
          burst(state.x + w / 2, state.y + h / 2, '#ec4899');
          cheer.textContent = '角に当たりました！ / Corner hit!';
          cheer.style.opacity = 1;
          hits.textContent = '角に当たった回数：' + corners;
          clearTimeout(cheerTimer);
          cheerTimer = setTimeout(function () {
            cheer.style.opacity = 0;
          }, 1800);
        }

        var last = null;
        function frame(now) {
          var dt = last === null ? 0 : Math.min(0.05, (now - last) / 1000);
          last = now;
          var hit = stepBounce(state, dt, maxX, maxY, SPEED);
          if (hit) nextLook();
          if (hit === 'corner') hitCorner();
          bot.style.transform = 'translate(' + state.x + 'px,' + state.y + 'px)';
          window.requestAnimationFrame(frame);
        }
        if (reduced) {
          bot.style.transform = 'translate(' + maxX / 2 + 'px,24px)';
        } else {
          window.requestAnimationFrame(frame);
        }

        // The announced end, if the app saw a notice before the server went away.
        try {
          var saved = JSON.parse(localStorage.getItem('planned-outage') || 'null');
          if (saved && new Date(saved.endsAt) > new Date()) {
            var until = document.getElementById('until');
            until.hidden = false;
            until.textContent =
              new Date(saved.endsAt).toLocaleString('ja-JP', {
                timeZone: 'Asia/Tokyo',
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
              }) + ' に終わる予定です';
          }
        } catch (e) {
          // Not known: the page works without it.
        }

        function showConnection() {
          if (navigator.onLine === false) {
            document.getElementById('title').textContent = 'インターネットに接続されていません';
            document.getElementById('body').textContent =
              '接続が戻ると自動で元の画面に戻ります。 / You are offline. This page returns by itself.';
          }
        }
        showConnection();
        window.addEventListener('offline', showConnection);
        window.addEventListener('online', function () {
          window.location.reload();
        });

        // Back when the real page answers again (this request skips the fallback).
        setInterval(function () {
          fetch(window.location.href, { cache: 'no-store', credentials: 'same-origin' })
            .then(function (response) {
              if (response.ok) window.location.reload();
            })
            .catch(function () {});
        }, CHECK_MS);
      })();
    </script>
  </body>
</html>
