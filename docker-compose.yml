# Local PostgreSQL for development (optional; a local PostgreSQL 16 also works).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: telesales
      POSTGRES_PASSWORD: telesales
      POSTGRES_DB: telesales_dev
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
